<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">VSDD architecture and iterative workflow</title>
<desc id="desc">A five-stage workflow connects product intent, feature specification and capability reuse, system architecture, software planning and implementation, and verification and convergence. Traceability, shared capability catalog, human approval gates, and change-impact feedback run across the process.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f2ff"/></linearGradient>
 <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1769aa"/><stop offset="1" stop-color="#6956c8"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7868c8"/></marker>
 <marker id="redarrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bf4050"/></marker>
 <style>
 .title{font:800 34px 'Inter','Arial',sans-serif;fill:#15243a}.subtitle{font:16px 'Inter','Arial',sans-serif;fill:#526179}
 .cardTitle{font:800 19px 'Inter','Arial',sans-serif;fill:#172b4d}.body{font:14px 'Inter','Arial',sans-serif;fill:#45536b}.small{font:12px 'Inter','Arial',sans-serif;fill:#617087}.num{font:800 13px 'Inter','Arial',sans-serif;fill:#fff}
 .bandTitle{font:800 17px 'Inter','Arial',sans-serif;fill:#192a44}.bandBody{font:13px 'Inter','Arial',sans-serif;fill:#4f5f75}.pill{font:700 12px 'Inter','Arial',sans-serif;fill:#51429c}
 </style>
</defs>
<rect width="1440" height="960" rx="22" fill="url(#bg)"/>
<rect x="0" y="0" width="1440" height="9" fill="url(#head)"/>
<text x="48" y="62" class="title">VSDD | Verifiable Spec-Driven Development</text>
<text x="48" y="94" class="subtitle">A change-driven engineering loop from product intent to verified software — with explicit decisions and evidence.</text>

<!-- Stage cards -->
<g>
 <rect x="40" y="132" width="250" height="272" rx="18" fill="#fff" stroke="#cddff4" stroke-width="1.5"/>
 <rect x="40" y="132" width="250" height="9" rx="5" fill="#1769aa"/>
 <circle cx="67" cy="170" r="15" fill="#1769aa"/><text x="67" y="175" text-anchor="middle" class="num">01</text>
 <text x="91" y="176" class="cardTitle">Explore &amp; Intake</text>
 <text x="60" y="216" class="body"><tspan x="60" dy="0">Clarify outcome, scope, actors,</tspan><tspan x="60" dy="22">constraints and unknowns.</tspan></text>
 <line x1="60" y1="270" x2="270" y2="270" stroke="#e2eaf4"/>
 <text x="60" y="297" class="small">Artifacts</text>
 <text x="60" y="320" class="body"><tspan x="60" dy="0">Feature brief</tspan><tspan x="60" dy="22">Source inventory · Open questions</tspan></text>
 <rect x="60" y="367" width="125" height="24" rx="12" fill="#eaf4ff"/><text x="122.5" y="383" text-anchor="middle" class="pill">vsdd-explore</text>

 <rect x="325" y="132" width="250" height="272" rx="18" fill="#fff" stroke="#d7cef8" stroke-width="1.5"/>
 <rect x="325" y="132" width="250" height="9" rx="5" fill="#6956c8"/>
 <circle cx="352" cy="170" r="15" fill="#6956c8"/><text x="352" y="175" text-anchor="middle" class="num">02</text>
 <text x="376" y="176" class="cardTitle">Specify &amp; Reuse</text>
 <text x="345" y="216" class="body"><tspan x="345" dy="0">Make behavior testable;</tspan><tspan x="345" dy="22">search capabilities before building.</tspan></text>
 <line x1="345" y1="270" x2="555" y2="270" stroke="#e6e0fa"/>
 <text x="345" y="297" class="small">Artifacts</text>
 <text x="345" y="320" class="body"><tspan x="345" dy="0">Feature Spec · Acceptance criteria</tspan><tspan x="345" dy="22">Capability/reuse map</tspan></text>
 <rect x="345" y="367" width="132" height="24" rx="12" fill="#f1edff"/><text x="411" y="383" text-anchor="middle" class="pill">specify + reuse</text>

 <rect x="610" y="132" width="250" height="272" rx="18" fill="#fff" stroke="#d7cef8" stroke-width="1.5"/>
 <rect x="610" y="132" width="250" height="9" rx="5" fill="#6956c8"/>
 <circle cx="637" cy="170" r="15" fill="#6956c8"/><text x="637" y="175" text-anchor="middle" class="num">03</text>
 <text x="661" y="176" class="cardTitle">System Architecture</text>
 <text x="630" y="216" class="body"><tspan x="630" dy="0">Derive system requirements;</tspan><tspan x="630" dy="22">allocate responsibilities and interfaces.</tspan></text>
 <line x1="630" y1="270" x2="840" y2="270" stroke="#e6e0fa"/>
 <text x="630" y="297" class="small">Artifacts</text>
 <text x="630" y="320" class="body"><tspan x="630" dy="0">SYS requirements · ADRs</tspan><tspan x="630" dy="22">Components · Interface contracts</tspan></text>
 <rect x="630" y="367" width="164" height="24" rx="12" fill="#f1edff"/><text x="712" y="383" text-anchor="middle" class="pill">architecture + allocation</text>

 <rect x="895" y="132" width="250" height="272" rx="18" fill="#fff" stroke="#cddff4" stroke-width="1.5"/>
 <rect x="895" y="132" width="250" height="9" rx="5" fill="#1769aa"/>
 <circle cx="922" cy="170" r="15" fill="#1769aa"/><text x="922" y="175" text-anchor="middle" class="num">04</text>
 <text x="946" y="176" class="cardTitle">Software &amp; Code</text>
 <text x="915" y="216" class="body"><tspan x="915" dy="0">Derive SWE requirements and tasks;</tspan><tspan x="915" dy="22">implement small vertical slices.</tspan></text>
 <line x1="915" y1="270" x2="1125" y2="270" stroke="#e2eaf4"/>
 <text x="915" y="297" class="small">Artifacts</text>
 <text x="915" y="320" class="body"><tspan x="915" dy="0">Software Spec · Task plan</tspan><tspan x="915" dy="22">Code diff · Tests</tspan></text>
 <rect x="915" y="367" width="162" height="24" rx="12" fill="#eaf4ff"/><text x="996" y="383" text-anchor="middle" class="pill">plan + implement</text>

 <rect x="1180" y="132" width="220" height="272" rx="18" fill="#fff" stroke="#e8c3c7" stroke-width="1.5"/>
 <rect x="1180" y="132" width="220" height="9" rx="5" fill="#bf4050"/>
 <circle cx="1207" cy="170" r="15" fill="#bf4050"/><text x="1207" y="175" text-anchor="middle" class="num">05</text>
 <text x="1231" y="176" class="cardTitle">Verify &amp; Converge</text>
 <text x="1200" y="216" class="body"><tspan x="1200" dy="0">Execute checks; compare intent</tspan><tspan x="1200" dy="22">with actual implementation.</tspan></text>
 <line x1="1200" y1="270" x2="1380" y2="270" stroke="#f2dfe1"/>
 <text x="1200" y="297" class="small">Artifacts</text>
 <text x="1200" y="320" class="body"><tspan x="1200" dy="0">Test evidence</tspan><tspan x="1200" dy="22">Gaps · Change impact</tspan></text>
 <rect x="1200" y="367" width="150" height="24" rx="12" fill="#fff0f1"/><text x="1275" y="383" text-anchor="middle" style="font:700 12px Inter,Arial;fill:#a12e3e">verify + converge</text>
</g>

<!-- forward arrows -->
<g fill="none" stroke="#8c7bd4" stroke-width="3" marker-end="url(#arrow)">
 <path d="M292 260 H319"/><path d="M577 260 H604"/><path d="M862 260 H889"/><path d="M1147 260 H1174"/>
</g>

<!-- shared foundations -->
<rect x="40" y="442" width="1360" height="206" rx="18" fill="#fff" stroke="#d9e1ec" stroke-width="1.4"/>
<text x="65" y="476" class="bandTitle">Shared engineering foundation — persists across every stage</text>
<g>
 <rect x="65" y="497" width="305" height="78" rx="12" fill="#eaf4ff" stroke="#c9e1fb"/>
 <text x="84" y="524" class="cardTitle" style="font-size:16px">Versioned Specs</text>
 <text x="84" y="548" class="bandBody">Source · status · stable IDs · changes</text>
 <rect x="395" y="497" width="305" height="78" rx="12" fill="#f1edff" stroke="#d9d0fa"/>
 <text x="414" y="524" class="cardTitle" style="font-size:16px">Capability Catalog</text>
 <text x="414" y="548" class="bandBody">Reuse evidence · contracts · owners</text>
 <rect x="725" y="497" width="305" height="78" rx="12" fill="#f1edff" stroke="#d9d0fa"/>
 <text x="744" y="524" class="cardTitle" style="font-size:16px">Architecture &amp; Contracts</text>
 <text x="744" y="548" class="bandBody">Allocation · interfaces · ADRs</text>
 <rect x="1055" y="497" width="320" height="78" rx="12" fill="#fff0f1" stroke="#f0d0d3"/>
 <text x="1074" y="524" class="cardTitle" style="font-size:16px">Traceability &amp; Evidence</text>
 <text x="1074" y="548" class="bandBody">Requirements ↔ code ↔ executed tests</text>
</g>
<text x="65" y="615" class="small">AI drafts, searches, compares and checks. Engineers approve product meaning, architecture commitments, deviations and release readiness.</text>

<!-- feedback loop -->
<rect x="40" y="674" width="1360" height="210" rx="18" fill="#fff" stroke="#d9e1ec" stroke-width="1.4"/>
<text x="65" y="709" class="bandTitle">Iterative feedback loop</text>
<g>
 <rect x="65" y="733" width="230" height="72" rx="11" fill="#fff0f1" stroke="#efc6cb"/>
 <text x="180" y="760" text-anchor="middle" class="cardTitle" style="font-size:15px">Gap / Change / Failed Test</text>
 <text x="180" y="782" text-anchor="middle" class="bandBody">Capture concrete evidence</text>
 <rect x="340" y="733" width="230" height="72" rx="11" fill="#f1edff" stroke="#d9d0fa"/>
 <text x="455" y="760" text-anchor="middle" class="cardTitle" style="font-size:15px">Identify Owning Artifact</text>
 <text x="455" y="782" text-anchor="middle" class="bandBody">Intent, spec, design, code or test</text>
 <rect x="615" y="733" width="230" height="72" rx="11" fill="#f1edff" stroke="#d9d0fa"/>
 <text x="730" y="760" text-anchor="middle" class="cardTitle" style="font-size:15px">Impact Analysis</text>
 <text x="730" y="782" text-anchor="middle" class="bandBody">Mark descendants for review</text>
 <rect x="890" y="733" width="230" height="72" rx="11" fill="#eaf4ff" stroke="#c9e1fb"/>
 <text x="1005" y="760" text-anchor="middle" class="cardTitle" style="font-size:15px">Update &amp; Re-verify</text>
 <text x="1005" y="782" text-anchor="middle" class="bandBody">Small vertical slice + evidence</text>
 <rect x="1165" y="733" width="210" height="72" rx="11" fill="#e8f7f1" stroke="#c9e9dd"/>
 <text x="1270" y="760" text-anchor="middle" class="cardTitle" style="font-size:15px">Converge</text>
 <text x="1270" y="782" text-anchor="middle" class="bandBody">No unaccepted gap remains</text>
</g>
<g fill="none" stroke="#7868c8" stroke-width="2.5" marker-end="url(#arrow)">
 <path d="M297 769 H334"/><path d="M572 769 H609"/><path d="M847 769 H884"/><path d="M1122 769 H1159"/>
</g>
<path d="M1270 809 C1270 856 180 856 180 811" fill="none" stroke="#bf4050" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#redarrow)"/>
<text x="720" y="853" text-anchor="middle" style="font:700 12px Inter,Arial;fill:#a12e3e">If any gap remains, loop back to its owner — never hide an upstream ambiguity with a downstream patch.</text>
<text x="40" y="924" class="small">VSDD is a workflow aid; project-specific engineering standards, safety/security processes, reviews and configuration control remain authoritative.</text>
</svg>