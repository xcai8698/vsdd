name: VSDD CLI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile CLI
        run: python -m py_compile scripts/vsdd.py
      - name: Run CLI tests
        run: python -m unittest discover -s tests -v
